<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    #boxshadow{

      
      
      margin: 150px;

    
      box-shadow : 10px 20px 5px 20px blue ;
    


          
        
      
      background-color: lightblue;

    }

    div:hover{

       box-shadow : 0px 0px 5px 20px blue  inset;
      color: red;
      margin: 150px;
      width: 400px;
   
     
    }
  </style>
</head>
<body>
  <div id = "boxshadow">
    <p>This is a paragraph with a box shadow.</p>
  </div>
</body>
</html>
